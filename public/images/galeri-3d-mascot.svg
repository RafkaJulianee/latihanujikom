<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="mascotBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="robotBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#mascotBg)"/>
  <!-- Robot Mascot Character -->
  <g transform="translate(300, 160)">
    <!-- Antenna -->
    <line x1="0" y1="-85" x2="0" y2="-65" stroke="#38BDF8" stroke-width="4"/>
    <circle cx="0" cy="-90" r="8" fill="#F59E0B"/>

    <!-- Head -->
    <rect x="-55" y="-65" width="110" height="75" rx="24" fill="url(#robotBody)"/>
    <!-- Face Screen -->
    <rect x="-42" y="-53" width="84" height="52" rx="16" fill="#0A0F1D"/>
    <!-- Glowing Eyes -->
    <ellipse cx="-18" cy="-27" rx="8" ry="10" fill="#38BDF8"/>
    <ellipse cx="18" cy="-27" rx="8" ry="10" fill="#38BDF8"/>
    <!-- Smile -->
    <path d="M -10 -10 Q 0 -4 10 -10" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Body -->
    <rect x="-40" y="20" width="80" height="65" rx="20" fill="url(#robotBody)"/>
    <circle cx="0" cy="50" r="14" fill="#0A0F1D"/>
    <circle cx="0" cy="50" r="6" fill="#10B981"/>
  </g>
  <text x="300" y="345" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#94A3B8">3D Mascot &amp; Virtual AI Companion</text>
</svg>
