<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="mobBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="phoneCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#mobBg)"/>

  <!-- Left Phone Mockup (Back Layer) -->
  <g filter="url(#phoneShadow)" transform="translate(130, 70) rotate(-6)">
    <rect width="160" height="280" rx="28" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    <rect x="8" y="8" width="144" height="264" rx="22" fill="#0A0F1D"/>
    <!-- UI Elements -->
    <rect x="20" y="30" width="120" height="60" rx="12" fill="url(#phoneCardGrad)"/>
    <rect x="20" y="105" width="120" height="35" rx="8" fill="#1E293B"/>
    <rect x="20" y="150" width="120" height="35" rx="8" fill="#1E293B"/>
    <rect x="20" y="195" width="120" height="35" rx="8" fill="#1E293B"/>
  </g>

  <!-- Right Phone Mockup (Front Layer) -->
  <g filter="url(#phoneShadow)" transform="translate(250, 45)">
    <!-- Outer Bezel -->
    <rect width="180" height="320" rx="32" fill="#0F172A" stroke="#38BDF8" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="8" width="164" height="304" rx="26" fill="url(#screenGrad)"/>
    
    <!-- Dynamic Island / Speaker notch -->
    <rect x="65" y="16" width="50" height="12" rx="6" fill="#000000"/>
    <circle cx="102" cy="22" r="3" fill="#1E293B"/>

    <!-- Screen Content Header -->
    <g transform="translate(20, 40)">
      <circle cx="15" cy="15" r="15" fill="#3B82F6"/>
      <rect x="40" y="6" width="70" height="8" rx="4" fill="#FFFFFF"/>
      <rect x="40" y="18" width="45" height="6" rx="3" fill="#64748B"/>
      
      <!-- Balance Card -->
      <g transform="translate(0, 40)">
        <rect width="140" height="75" rx="14" fill="url(#phoneCardGrad)"/>
        <text x="14" y="24" font-family="sans-serif" font-size="9" fill="#E2E8F0">Total Saldo Proyek</text>
        <text x="14" y="46" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">Rp 48.500.000</text>
        <rect x="14" y="56" width="45" height="10" rx="5" fill="#FFFFFF" opacity="0.3"/>
      </g>

      <!-- Quick Action Icons -->
      <g transform="translate(0, 130)">
        <circle cx="16" cy="16" r="14" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
        <circle cx="52" cy="16" r="14" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
        <circle cx="88" cy="16" r="14" fill="#1E293B" stroke="#EC4899" stroke-width="1"/>
        <circle cx="124" cy="16" r="14" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
      </g>

      <!-- Transaction List -->
      <g transform="translate(0, 175)">
        <rect width="140" height="30" rx="8" fill="#1E293B"/>
        <circle cx="15" cy="15" r="8" fill="#10B981"/>
        <rect x="30" y="11" width="50" height="8" rx="3" fill="#E2E8F0"/>
        <rect x="105" y="11" width="25" height="8" rx="3" fill="#10B981"/>

        <rect y="36" width="140" height="30" rx="8" fill="#1E293B"/>
        <circle cx="15" cy="51" r="8" fill="#3B82F6"/>
        <rect x="30" y="47" width="45" height="8" rx="3" fill="#E2E8F0"/>
        <rect x="105" y="47" width="25" height="8" rx="3" fill="#3B82F6"/>
      </g>
    </g>

    <!-- Home indicator bar -->
    <rect x="65" y="302" width="50" height="4" rx="2" fill="#64748B"/>
  </g>

  <!-- Floating Badge: iOS & Android -->
  <g filter="url(#phoneShadow)" transform="translate(440, 160)">
    <rect width="120" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="16" y="26" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Cross-Platform</text>
    <text x="16" y="44" font-family="sans-serif" font-size="10" fill="#38BDF8">Flutter &amp; React Native</text>
  </g>
</svg>
