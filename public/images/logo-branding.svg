<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="brandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="vectorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="brandShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#brandBg)"/>

  <!-- Geometric Grid Background Elements -->
  <g opacity="0.12">
    <circle cx="300" cy="200" r="150" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6 6"/>
    <circle cx="300" cy="200" r="90" stroke="#FFFFFF" stroke-width="1.5"/>
    <line x1="300" y1="20" x2="300" y2="380" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="100" y1="200" x2="500" y2="200" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Central Diamond Branding Emblem -->
  <g filter="url(#brandShadow)" transform="translate(230, 80)">
    <!-- Golden Geometric Hexagon/Diamond -->
    <path d="M 70 10 L 130 50 L 130 130 L 70 170 L 10 130 L 10 50 Z" fill="url(#vectorGrad)" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M 70 25 L 115 55 L 115 125 L 70 155 L 25 125 L 25 55 Z" fill="#0F172A" opacity="0.6"/>
    
    <!-- Central Brand Symbol (Letter 'Z' or Crown) -->
    <path d="M 45 65 L 95 65 L 60 100 L 95 100 L 95 115 L 45 115 L 80 80 L 45 80 Z" fill="#FFFFFF"/>
  </g>

  <!-- Color Palette Swatches (Left) -->
  <g filter="url(#brandShadow)" transform="translate(60, 110)">
    <rect width="120" height="180" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <rect x="15" y="15" width="90" height="30" rx="6" fill="#2563EB"/>
    <rect x="15" y="55" width="90" height="30" rx="6" fill="#8B5CF6"/>
    <rect x="15" y="95" width="90" height="30" rx="6" fill="#EC4899"/>
    <rect x="15" y="135" width="90" height="30" rx="6" fill="#F59E0B"/>
  </g>

  <!-- Typography Specimen Card (Right) -->
  <g filter="url(#brandShadow)" transform="translate(420, 130)">
    <rect width="130" height="150" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="20" y="55" font-family="sans-serif" font-weight="900" font-size="44" fill="#FFFFFF">Aa</text>
    <rect x="20" y="80" width="85" height="6" rx="3" fill="#94A3B8"/>
    <rect x="20" y="95" width="70" height="6" rx="3" fill="#64748B"/>
    <rect x="20" y="110" width="80" height="6" rx="3" fill="#64748B"/>
    <rect x="20" y="125" width="50" height="6" rx="3" fill="#3B82F6"/>
  </g>

  <!-- Vector Pen Anchor Points -->
  <circle cx="240" cy="130" r="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="360" cy="130" r="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
  <circle cx="300" cy="250" r="6" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2"/>
</svg>
