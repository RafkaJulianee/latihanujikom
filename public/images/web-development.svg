<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="webShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="400" rx="16" fill="url(#webBg)"/>

  <!-- Code Editor Window -->
  <g filter="url(#webShadow)">
    <rect x="90" y="50" width="420" height="280" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
    <!-- Window Bar -->
    <path d="M 90 50 L 510 50 L 510 85 L 90 85 Z" fill="#1E293B"/>
    <circle cx="112" cy="68" r="5" fill="#EF4444"/>
    <circle cx="128" cy="68" r="5" fill="#F59E0B"/>
    <circle cx="144" cy="68" r="5" fill="#10B981"/>
    <rect x="210" y="61" width="180" height="14" rx="7" fill="#334155"/>

    <!-- Code Line Elements -->
    <g transform="translate(120, 110)">
      <!-- Line 1: import ... -->
      <rect x="0" y="0" width="45" height="10" rx="3" fill="#F43F5E"/>
      <rect x="55" y="0" width="60" height="10" rx="3" fill="#38BDF8"/>
      <rect x="125" y="0" width="30" height="10" rx="3" fill="#F43F5E"/>
      <rect x="165" y="0" width="70" height="10" rx="3" fill="#10B981"/>

      <!-- Line 2: function -->
      <rect x="0" y="24" width="55" height="10" rx="3" fill="#818CF8"/>
      <rect x="65" y="24" width="80" height="10" rx="3" fill="#FBBF24"/>
      <rect x="155" y="24" width="20" height="10" rx="3" fill="#94A3B8"/>

      <!-- Line 3: return ( -->
      <rect x="20" y="48" width="45" height="10" rx="3" fill="#F43F5E"/>
      <rect x="75" y="48" width="150" height="10" rx="3" fill="#38BDF8"/>

      <!-- Line 4: HTML Tag -->
      <rect x="40" y="72" width="65" height="10" rx="3" fill="#3B82F6"/>
      <rect x="115" y="72" width="80" height="10" rx="3" fill="#A855F7"/>
      <rect x="205" y="72" width="110" height="10" rx="3" fill="#10B981"/>

      <!-- Line 5: Component -->
      <rect x="40" y="96" width="90" height="10" rx="3" fill="#3B82F6"/>
      <rect x="140" y="96" width="130" height="10" rx="3" fill="#FBBF24"/>

      <!-- Line 6: Closing tag -->
      <rect x="20" y="120" width="30" height="10" rx="3" fill="#F43F5E"/>
      <rect x="0" y="144" width="15" height="10" rx="3" fill="#818CF8"/>
    </g>
  </g>

  <!-- Floating Badge: Fullstack & Speed -->
  <g filter="url(#webShadow)" transform="translate(360, 210)">
    <rect width="180" height="110" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
    <rect x="20" y="20" width="40" height="40" rx="10" fill="url(#codeGrad)"/>
    <!-- Lightning Icon inside Badge -->
    <path d="M 42 28 L 34 40 L 40 40 L 38 52 L 48 38 L 42 38 Z" fill="#FFFFFF"/>
    <text x="72" y="38" font-family="sans-serif" font-weight="bold" font-size="13" fill="#FFFFFF">Ultra Fast</text>
    <text x="72" y="54" font-family="sans-serif" font-size="11" fill="#94A3B8">Next.js &amp; API</text>
    <rect x="20" y="75" width="140" height="6" rx="3" fill="#334155"/>
    <rect x="20" y="75" width="110" height="6" rx="3" fill="#10B981"/>
  </g>

  <!-- Left Code Bracket Accent -->
  <g filter="url(#webShadow)" transform="translate(50, 180)">
    <circle cx="35" cy="35" r="32" fill="#2563EB" opacity="0.9"/>
    <text x="21" y="44" font-family="monospace" font-weight="900" font-size="26" fill="#FFFFFF">&lt;/&gt;</text>
  </g>
</svg>
