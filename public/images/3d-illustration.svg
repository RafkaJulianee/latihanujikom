<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="threeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="cubeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="cubeLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cubeRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="cubePurpleTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="cubePurpleLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>
    <linearGradient id="cubePurpleRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B21A8"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <filter id="threeShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#threeBg)"/>

  <!-- Isometric Grid Grid Background -->
  <g opacity="0.15">
    <path d="M 0 200 L 300 370 L 600 200 L 300 30 Z" stroke="#38BDF8" stroke-width="1.5" fill="none"/>
    <circle cx="300" cy="200" r="140" stroke="#818CF8" stroke-width="1" stroke-dasharray="6 6"/>
  </g>

  <!-- Large Central 3D Isometric Cube -->
  <g filter="url(#threeShadow)" transform="translate(300, 185)">
    <!-- Top Face -->
    <polygon points="0,-75 65,-37 0,0 -65,-37" fill="url(#cubeTop)"/>
    <!-- Left Face -->
    <polygon points="-65,-37 0,0 0,75 -65,37" fill="url(#cubeLeft)"/>
    <!-- Right Face -->
    <polygon points="0,0 65,-37 65,37 0,75" fill="url(#cubeRight)"/>
  </g>

  <!-- Smaller Floating Purple 3D Cube (Left) -->
  <g filter="url(#threeShadow)" transform="translate(160, 120)">
    <!-- Top Face -->
    <polygon points="0,-40 35,-20 0,0 -35,-20" fill="url(#cubePurpleTop)"/>
    <!-- Left Face -->
    <polygon points="-35,-20 0,0 0,40 -35,20" fill="url(#cubePurpleLeft)"/>
    <!-- Right Face -->
    <polygon points="0,0 35,-20 35,20 0,40" fill="url(#cubePurpleRight)"/>
  </g>

  <!-- Smaller Floating Cyan 3D Sphere / Torus (Right) -->
  <g filter="url(#threeShadow)" transform="translate(440, 240)">
    <circle cx="0" cy="0" r="35" fill="url(#cubeTop)"/>
    <ellipse cx="0" cy="0" rx="45" ry="12" stroke="#38BDF8" stroke-width="3" fill="none" transform="rotate(-20)"/>
  </g>

  <!-- Floating Sparkles & Isometric Coordinates -->
  <g transform="translate(430, 90)">
    <polygon points="15,0 19,10 30,15 19,19 15,30 11,19 0,15 11,10" fill="#FBBF24"/>
  </g>
  <g transform="translate(170, 260)">
    <polygon points="12,0 15,8 24,12 15,15 12,24 9,15 0,12 9,8" fill="#38BDF8"/>
  </g>
</svg>
