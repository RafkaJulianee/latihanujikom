<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="cloudBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cloudShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#cloudBg)"/>

  <!-- Central Cloud Graphic -->
  <g filter="url(#cloudShadow)" transform="translate(180, 80)">
    <!-- Cloud Path -->
    <path d="M 60 140 C 35 140 15 120 15 95 C 15 72 32 53 54 50 C 66 22 96 2 132 2 C 174 2 208 28 217 64 C 235 68 248 84 248 104 C 248 124 231 140 211 140 Z" fill="url(#cloudGrad)"/>
    
    <!-- Sync / Upload Arrow inside Cloud -->
    <g transform="translate(105, 55)">
      <path d="M 27 65 L 27 15 M 10 32 L 27 15 L 44 32" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Surrounding Infrastructure Nodes -->
  <!-- Node 1: Fast Storage -->
  <g filter="url(#cloudShadow)" transform="translate(80, 240)">
    <rect width="130" height="75" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">SSD Storage</text>
    <text x="16" y="52" font-family="sans-serif" font-size="11" fill="#10B981">99.99% Uptime</text>
  </g>

  <!-- Node 2: Global CDN -->
  <g filter="url(#cloudShadow)" transform="translate(390, 240)">
    <rect width="130" height="75" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="16" y="32" font-family="sans-serif" font-weight="bold" font-size="12" fill="#FFFFFF">Global CDN</text>
    <text x="16" y="52" font-family="sans-serif" font-size="11" fill="#38BDF8">&lt;20ms Latency</text>
  </g>
</svg>
