<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="softBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="softGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#softBg)"/>

  <!-- Central Server & Cloud Database Stack -->
  <g filter="url(#softShadow)" transform="translate(180, 80)">
    <!-- Server Unit 1 -->
    <rect width="240" height="60" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="30" cy="30" r="8" fill="#10B981"/>
    <circle cx="55" cy="30" r="8" fill="#3B82F6"/>
    <line x1="85" y1="24" x2="200" y2="24" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="36" x2="160" y2="36" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Server Unit 2 -->
    <rect y="80" width="240" height="60" rx="12" fill="#1E293B" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="30" cy="110" r="8" fill="#10B981"/>
    <circle cx="55" cy="110" r="8" fill="#F59E0B"/>
    <line x1="85" y1="104" x2="210" y2="104" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="116" x2="180" y2="116" stroke="#475569" stroke-width="3" stroke-linecap="round"/>

    <!-- Server Unit 3 -->
    <rect y="160" width="240" height="60" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <circle cx="30" cy="190" r="8" fill="#10B981"/>
    <circle cx="55" cy="190" r="8" fill="#3B82F6"/>
    <line x1="85" y1="184" x2="190" y2="184" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <line x1="85" y1="196" x2="140" y2="196" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Left Connecting API Node -->
  <g filter="url(#softShadow)" transform="translate(60, 150)">
    <circle cx="35" cy="35" r="35" fill="url(#softGrad)"/>
    <text x="18" y="42" font-family="sans-serif" font-weight="900" font-size="16" fill="#FFFFFF">API</text>
    <path d="M 70 35 L 120 35" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Right Connecting Security Shield -->
  <g filter="url(#softShadow)" transform="translate(460, 150)">
    <rect width="70" height="70" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 35 18 L 52 26 L 52 42 C 52 52 35 60 35 60 C 35 60 18 52 18 42 L 18 26 Z" fill="#10B981" opacity="0.9"/>
    <polyline points="28,38 33,43 43,33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
