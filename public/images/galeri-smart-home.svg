<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="smHomeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#smHomeBg)"/>
  <!-- Central Smart Hub Card -->
  <g transform="translate(180, 60)">
    <rect width="240" height="240" rx="20" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="120" y="45" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF">Living Room 24°C</text>
    
    <!-- Big Power Circle -->
    <circle cx="120" cy="115" r="45" fill="#1E293B" stroke="#10B981" stroke-width="3"/>
    <path d="M 120 95 L 120 115 M 105 105 A 22 22 0 1 0 135 105" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Light sliders -->
    <rect x="35" y="180" width="80" height="35" rx="8" fill="#1E293B"/>
    <text x="75" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#38BDF8">Lights 80%</text>

    <rect x="125" y="180" width="80" height="35" rx="8" fill="#1E293B"/>
    <text x="165" y="202" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#F59E0B">AC Auto</text>
  </g>
  <text x="300" y="345" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="18" fill="#94A3B8">IoT Smart Home Mobile Interface</text>
</svg>
