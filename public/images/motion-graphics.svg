<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400" fill="none">
  <defs>
    <linearGradient id="mgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="mgShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#mgBg)"/>

  <!-- Timeline Interface Container -->
  <g filter="url(#mgShadow)">
    <!-- Video Player Preview Area -->
    <rect x="100" y="45" width="400" height="210" rx="14" fill="#0A0F1D" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Central Dynamic Motion Graphic Element -->
    <g transform="translate(300, 150)">
      <!-- Pulsing concentric wave circles -->
      <circle cx="0" cy="0" r="75" stroke="#3B82F6" stroke-width="2" stroke-dasharray="8 6" opacity="0.4"/>
      <circle cx="0" cy="0" r="55" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6 4" opacity="0.7"/>
      <circle cx="0" cy="0" r="38" fill="url(#playGrad)"/>
      <!-- Play Triangle -->
      <polygon points="-8,-12 14,0 -8,12" fill="#FFFFFF"/>
    </g>

    <!-- Floating Graphic Particles -->
    <circle cx="160" cy="100" r="8" fill="#38BDF8"/>
    <rect x="420" y="85" width="16" height="16" rx="4" fill="#F59E0B" transform="rotate(25 428 93)"/>
    <polygon points="410,180 425,205 395,205" fill="#EC4899"/>
    <rect x="180" y="190" width="14" height="14" rx="3" fill="#10B981"/>

    <!-- Bottom Timeline Track -->
    <rect x="100" y="270" width="400" height="75" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <!-- Track 1: Keyframe diamonds -->
    <line x1="120" y1="295" x2="480" y2="295" stroke="#334155" stroke-width="2"/>
    <rect x="150" y="289" width="12" height="12" rx="2" fill="#EC4899" transform="rotate(45 156 295)"/>
    <rect x="260" y="289" width="12" height="12" rx="2" fill="#8B5CF6" transform="rotate(45 266 295)"/>
    <rect x="380" y="289" width="12" height="12" rx="2" fill="#3B82F6" transform="rotate(45 386 295)"/>

    <!-- Track 2: Audio/Clip Bar -->
    <rect x="120" y="315" width="110" height="16" rx="4" fill="#3B82F6" opacity="0.8"/>
    <rect x="240" y="315" width="150" height="16" rx="4" fill="#8B5CF6" opacity="0.8"/>
    <rect x="400" y="315" width="80" height="16" rx="4" fill="#EC4899" opacity="0.8"/>

    <!-- Timeline Scrubber / Playhead -->
    <line x1="266" y1="265" x2="266" y2="345" stroke="#FFFFFF" stroke-width="2"/>
    <polygon points="260,265 272,265 266,275" fill="#FFFFFF"/>
  </g>
</svg>
